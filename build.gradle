plugins {
    id "java"
    id "io.canvasmc.weaver.userdev" version "${weaver_version}"
    id "xyz.jpenilla.run-paper" version "${run_paper_version}"
}

group = "com.unfamoussoul"
version = "1.0.0"

def canvasVersion = project.property('canvas_version')

def idx = canvasVersion.indexOf('.build.')
if (idx < 0) throw new GradleException("Нет маркера .build. в canvas_version: $canvasVersion")

def canvasServerVersion = canvasVersion.substring(0, idx)
def build_ver = canvasVersion.substring(idx + '.build.'.length()).split('-')[0]

repositories {
    mavenCentral()
    maven { url = "https://maven.canvasmc.io/releases" }
    maven {
        url = "https://maven.canvasmc.io/snapshots"
        mavenContent { snapshotsOnly() }
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = "https://repo.extendedclip.com/releases/"
    }
    maven {
        url = "https://repo.extendedclip.com/job/"
    }
    maven {
        url = 'https://nexus.scarsz.me/content/groups/public/'
    }
    maven {
        url = "https://jitpack.io"
    }
}

dependencies {
    paperweight.canvasDevBundle("${canvas_version}")

    compileOnly "com.github.UnFamousSoul:SChatAPI:${schat_api_version}"
}

test {
    useJUnitPlatform()
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("paper-plugin.yml") {
        expand props
    }
}

def canvasServerJar = layout.buildDirectory.file("canvas/canvas-${canvasServerVersion}.jar")
def downloadCanvas = tasks.register("downloadCanvas") {
    group = "run paper"
    description = "Download the Canvas ${canvasServerVersion} server jar."
    def out = canvasServerJar
    outputs.file(out)
    onlyIf { !out.get().asFile.exists() }
    doLast {
        def url = "https://jenkins.canvasmc.io/job/Canvas/${build_ver}/artifact/canvas-server/build/libs/canvas-build.${build_ver}.jar"
        def target = out.get().asFile
        target.parentFile.mkdirs()
        new URI(url).toURL().withInputStream { input ->
            target.withOutputStream { it << input }
        }
    }
}

tasks.named("runServer") {
    dependsOn(downloadCanvas)
    minecraftVersion(canvasServerVersion)
    serverJar(canvasServerJar)

    pluginJars(file("libs/PlaceholderAPI-${papi_version}.jar"))
    downloadPlugins {
        modrinth("luckperms", "${luckperms_plugin_version}")
        modrinth("skinsrestorer", "${skinsrestorer_plugin_version}")
    }
}
